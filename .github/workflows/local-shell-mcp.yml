name: local-shell-mcp

on:
  push:
    branches:
      - feat/local-shell-mcp
    paths:
      - "tools/local-shell-mcp/**"
      - ".github/workflows/local-shell-mcp.yml"
  pull_request:
    paths:
      - "tools/local-shell-mcp/**"
      - ".github/workflows/local-shell-mcp.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/local-shell-mcp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
